plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.widgetsnapshotbridge'
version = '0.1.0'

android {
  namespace "expo.modules.widgetsnapshotbridge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // `org.json` is an Android framework class with stub-only methods on the unit
  // test classpath. The real implementation is put there instead, so the parser
  // can be tested without a device or Robolectric.
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
