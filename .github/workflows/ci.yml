name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type check, lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile says and fails if the two have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # No Firebase environment variables and no secrets. The suite does not
      # read them: without a project the app behaves as one with no accounts,
      # and the tests that care set their own values.
      #
      # --randomize because the order the files sit in is not a guarantee
      # anybody meant to give: its first local run caught a store value
      # leaking between describes. The seed is printed on failure; reproduce
      # with `npx jest --ci --randomize --seed <n>`.
      #
      # --coverage enforces the floor in jest.config.js. The idle-memory limit
      # recycles workers that balloon under instrumentation — one local
      # coverage run lost a whole suite to a worker crash without it.
      - name: Test
        run: npx jest --ci --randomize --coverage --workerIdleMemoryLimit=1GB

  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The Firestore emulator is a Java program; the runner's default JDK is
      # not pinned, so pin one the emulator documents support for.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # A demo- project id, no credentials: the emulator accepts any project
      # that never touches production. The rules file under test is the same
      # one `rules:deploy` ships.
      - name: Test the rules against the emulator
        run: npm run test:rules

  android:
    name: Android module unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Node before Gradle: expo-modules-autolinking resolves the module list
      # through node_modules, so a Gradle sync without them fails at settings
      # evaluation, not at a test.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # The widget renders someone's period data on their home screen and the
      # privacy module decides when the screen may be captured - the two local
      # modules whose tests exist in Kotlin and ran nowhere until this job.
      - name: Run the local modules' unit tests
        working-directory: android
        run: ./gradlew :widget-snapshot-bridge:testDebugUnitTest :screen-privacy:testDebugUnitTest --console=plain
