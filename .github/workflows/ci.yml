name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type check, lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile says and fails if the two have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # No Firebase environment variables and no secrets. The suite does not
      # read them: without a project the app behaves as one with no accounts,
      # and the tests that care set their own values.
      - name: Test
        run: npx jest --ci

  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The Firestore emulator is a Java program; the runner's default JDK is
      # not pinned, so pin one the emulator documents support for.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # A demo- project id, no credentials: the emulator accepts any project
      # that never touches production. The rules file under test is the same
      # one `rules:deploy` ships.
      - name: Test the rules against the emulator
        run: npm run test:rules
