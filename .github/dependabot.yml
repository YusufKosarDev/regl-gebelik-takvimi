# Dependency update PRs, weekly, grouped so the inbox stays readable.
#
# Expo pins most of the React Native surface: `expo install` keeps those
# versions in step with the SDK, and a lone bump from a bot can move one
# package out of the set the SDK was tested with. So the npm ecosystem groups
# everything Expo manages into one PR a person can judge as a unit, and the
# rule stays: an Expo SDK upgrade is done with `npx expo install --fix`, not
# by merging bot PRs one by one.
#
# A group is only as good as what it keeps together. `jest` and `@types/jest`
# sat in the other group on the first run, and the result was a PR that could
# not be installed at all: `jest-expo` 58 declares `jest@^30` as a peer, so
# the bump to jest-expo and the bump to jest have to arrive in the same PR or
# neither branch resolves. They are listed with jest-expo now, for the reason
# the whole group exists - jest-expo pins jest's major the way Expo pins the
# rest.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      expo-managed:
        patterns:
          - 'expo*'
          - '@expo/*'
          - 'react'
          - 'react-dom'
          - 'react-native*'
          - '@react-native*/*'
          - 'jest-expo'
          - 'jest'
          - '@types/jest'
          - 'babel-preset-expo'
      everything-else:
        patterns:
          - '*'
        exclude-patterns:
          - 'expo*'
          - '@expo/*'
          - 'react'
          - 'react-dom'
          - 'react-native*'
          - '@react-native*/*'
          - 'jest-expo'
          - 'jest'
          - '@types/jest'
          - 'babel-preset-expo'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

# No gradle ecosystem: android/ is a prebuild product and is not in the
# repository, and the local modules' build.gradle files pin nothing of their
# own - their versions come through expo-modules-core, which the npm group
# above already covers.
